name: Archive tech news issues

on:
  issues:
    types:
      - opened
      - edited
      - reopened
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to archive or rebuild"
        required: true
        type: string

permissions:
  contents: write
  issues: read

concurrency:
  group: technews-issue-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.issue.pull_request == null

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Archive issue from event
        if: github.event_name == 'issues'
        run: python scripts/archive_issue.py --event "$GITHUB_EVENT_PATH"

      - name: Fetch manually selected issue
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" > /tmp/technews-issue.json

      - name: Archive manually selected issue
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/archive_issue.py --issue /tmp/technews-issue.json

      - name: Commit generated Markdown
        env:
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          ISSUE_NUMBER="${EVENT_ISSUE_NUMBER:-$INPUT_ISSUE_NUMBER}"

          # git diff does not include newly generated untracked files.
          if [ -z "$(git status --porcelain -- docs/)" ]; then
            echo "No generated document changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/
          if git diff --cached --quiet; then
            echo "No staged changes."
            exit 0
          fi

          git commit -m "docs: archive tech news issue #${ISSUE_NUMBER}"

          # Archive workflows are serialized, and this also reconciles any
          # unrelated default-branch commit that landed during this run.
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
